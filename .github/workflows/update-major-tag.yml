name: Update Major Version Tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Update Major Version Tag
    if: "!github.event.release.prerelease && !github.event.release.draft"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update major pointer tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Processing release tag: $RELEASE_TAG"

          # Validate semver pattern (^v[0-9]+(\.[0-9]+)*$) and extract major version
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)(\.[0-9]+)*$ ]]; then
            MAJOR_TAG="v${BASH_REMATCH[1]}"
            echo "Identified major tag: $MAJOR_TAG"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Update major tag pointer to the release commit
            git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG pointer to $RELEASE_TAG" HEAD
            git push origin "$MAJOR_TAG" --force
            echo "Successfully updated $MAJOR_TAG to point to $RELEASE_TAG"
          else
            echo "Tag '$RELEASE_TAG' does not match semver pattern ^v[0-9]+(\.[0-9]+)*$. Skipping major tag update."
          fi
